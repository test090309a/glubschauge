[capture]
tshark_path = "M:\\Wireshark\\tshark.exe"
interface   = "8"
bpf_filter  = "not port 22 and not port 21027"

[network]
# Alles außerhalb dieser Subnetze ist Transit-Verkehr und wird ignoriert.
local_subnets = [
  "192.168.0.0/24",
  "fe80::/10",          # Link-Local (Router-Announcements, NDP)
  "ff02::/16",          # IPv6 Multicast lokal
  "224.0.0.0/4",        # IPv4 Multicast lokal (mDNS, SSDP)
]

# Bekannte Geräte: werden nie als "neu" gemeldet.
trusted_hosts = [
  "00:cb:7a:50:16:c4",  # Router (Vantiva)
  "34:5a:60:12:61:4c",  # Windows-PC (Micro-Star)
  # "d8:3a:dd:e2:32:11",  # Raspberry Pi (Kodi ventosus)
  # "b8:27:eb:92:e8:10",  # Raspberry Pi (Kodi inertia)
  "70:85:c2:a0:c1:dd",  # ASRock-PC
  "02:10:18:50:16:c1",  # Router Link-Local
]

[detectors]
# new_host_warmup_seconds  = 60
new_host_warmup_seconds  = 0
# syn_fan_out_threshold    = 25
syn_fan_out_threshold    = 5
syn_fan_out_window_s     = 10
beaconing_min_samples    = 8
beaconing_max_jitter_cv  = 0.10
beaconing_window_minutes = 60
volume_threshold_mb      = 250.0
volume_window_s          = 60

[ring]
enabled         = true
ring_dir        = "ring"
file_interval_s = 10
num_files       = 12
bpf_filter      = ""